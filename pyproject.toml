[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel", "numpy"]

[project]
name = "ieeg"
description = "A Python package for iEEG data processing."
authors = [
    {name = "Aaron Earle-Richardson", email = "ae166@duke.edu"},
    {name = "Raymond Xiong", email = "raymond.xiong@duke.edu"}
]
dynamic = ["dependencies", "version"]
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["ieeg*"]

[project.license]
file = "LICENSE"

[project.urls]
Homepage = "https://github.com/coganlab/IEEG_Pipelines"
Source = "https://github.com/coganlab/IEEG_Pipelines"
Issues = "https://github.com/coganlab/IEEG_Pipelines/Issues"
Documentation = "https://ieeg-pipelines.readthedocs.io/en/latest/"

[tool.setuptools.dynamic]
dependencies = {file = ["envs/requirements.txt"]}

[project.optional-dependencies]
# GUI / Qt plotting (pyvistaqt-backed brain weight plotters in ieeg/viz/mri.py)
viz-qt = ["pyqt5", "pyvistaqt"]
# PyTorch decoder paths (currently only used on wip/decoding-experiments branch,
# but kept here so optional usage stays consistent)
torch = ["torch", "lightning", "torchmetrics"]
# GPU support — minimum required for the superlets CUDA path. Uses
# NVIDIA's official cuda-python bindings (lightweight, ~5 MB) for nvrtc
# compilation and cuLaunchKernel. Works with any array library that
# exposes __cuda_array_interface__ (cupy, torch CUDA tensors, etc.).
cuda = ["cuda-python"]
# Optional: full cupy array library if you want cupy ndarrays as your
# GPU backend rather than torch CUDA tensors.
cupy = ["cupy-cuda12x"]
# System-memory introspection in ieeg/process.py (lazy-imported at call time)
sysmem = ["psutil"]
# NOTE: pybids (`bids`) is currently in core requirements because it is used
# pervasively in ieeg/io.py and ieeg/navigate.py as a cross-cutting type
# (BIDSLayout). Making it optional requires a refactor — see TODO in
# CONTRIBUTING.md or open an issue.
# Dev / test tooling
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pytest-pycodestyle",
    "coverage",
]

[tool.ruff.lint]
select = ["NPY201"]

[tool.pytest.ini_options]
testpaths = ["tests", "ieeg"]
addopts = "--doctest-modules --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
